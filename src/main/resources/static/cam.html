<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SIET LMS Student Dashboard with Camera Monitoring</title>
    <style>
        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          margin: 0;
          padding: 0;
          background: linear-gradient(to right, #2ecc71, #27ae60);
          color: #333;
        }

        .main-content {
          padding: 40px;
          background-color: #fff;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
          border-radius: 10px;
          margin: 50px auto;
          max-width: 1000px;
          position: relative;
        }

        h3 {
          font-size: 2.5rem;
          font-weight: bold;
          margin-bottom: 20px;
          color: #2e8b57;
          text-align: center;
        }

        .timer {
          font-size: 1.5rem;
          color: red;
          margin-bottom: 20px;
          text-align: center;
        }

        .camera-container {
          position: relative;
          text-align: center;
          margin-bottom: 20px;
        }

        canvas {
          width: 640px;
          height: 480px;
          border-radius: 10px;
          margin: 0 10px;
          background-color: #1a1a1a;
          border: 2px solid #2ecc71;
        }

        .status {
          text-align: center;
          font-size: 1.1rem;
          margin-top: 10px;
          color: green;
        }

        .malpractice {
          color: red;
          font-weight: bold;
        }

        .course-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
          gap: 20px;
        }

        .course-card {
          background-color: #fff;
          padding: 20px;
          border-radius: 12px;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .course-card button {
          background-color: #28a745;
          color: white;
          padding: 12px 20px;
          border: none;
          border-radius: 8px;
          font-size: 1.1rem;
          cursor: pointer;
        }

        .test-card {
          background-color: #ecf0f1;
          padding: 20px;
          border-radius: 10px;
          margin-bottom: 20px;
        }

        button {
          padding: 10px 20px;
          background-color: #2e8b57;
          color: white;
          border: none;
          border-radius: 8px;
          cursor: pointer;
        }

        /* Loading overlay */
        .loading-overlay {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(0,0,0,0.7);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          color: white;
          font-size: 1.3rem;
          gap: 20px;
        }
        .spinner {
          width: 60px; height: 60px;
          border: 6px solid rgba(255,255,255,0.3);
          border-top-color: #2ecc71;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .camera-error {
          background: #fff3cd;
          border: 1px solid #ffc107;
          padding: 15px;
          border-radius: 8px;
          margin: 10px 0;
          color: #856404;
        }

        @media (max-width: 768px) {
          .course-grid { grid-template-columns: 1fr; }
          canvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>

<div class="main-content" id="dashboard">
    <h3>Student Dashboard</h3>
    <div class="course-grid">
        <div class="course-card">
            <h4>Test: ITVAC Training</h4>
            <p>CTPS</p>
            <button onclick="takeTest('CTPS')">Take Test</button>
        </div>
        <div class="course-card">
            <h4>Test: ITVAC Training</h4>
            <p>Java</p>
            <button onclick="takeTest('Java')">Take Test</button>
        </div>
        <div class="course-card">
            <h4>Test: ITVAC Training</h4>
            <p>ADS</p>
            <button onclick="takeTest('ADS')">Take Test</button>
        </div>
    </div>
</div>

<audio id="alertSound" src="smoke.mp3" preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
    let video, canvas, context, model, timer, timeLeft = 600, testType;
    let malpracticeDetected = false;
    let testInProgress = false;
    let monitoringStarted = false;
    const GRACE_PERIOD_MS = 5000; // 5 second warm-up before malpractice detection kicks in
    let monitoringStartTime = 0;

    window.onload = function () {
      // Page loaded - questions are validated per-test when student clicks Take Test
    };

    function showLoading(message) {
      removeLoading();
      const div = document.createElement('div');
      div.className = 'loading-overlay';
      div.id = 'loadingOverlay';
      div.innerHTML = `<div class="spinner"></div><div id="loadingMsg">${message}</div>`;
      document.body.appendChild(div);
    }

    function updateLoadingMsg(msg) {
      const el = document.getElementById('loadingMsg');
      if (el) el.textContent = msg;
    }

    function removeLoading() {
      const el = document.getElementById('loadingOverlay');
      if (el) el.remove();
    }

    async function takeTest(type) {
      testType = type;
      timeLeft = parseInt(localStorage.getItem(`duration_${type}`)) || 600;
      malpracticeDetected = false;
      testInProgress = true;
      monitoringStarted = false;

      document.getElementById('dashboard').innerHTML = `
        <h3>Test: ${type}</h3>
        <div class="timer" id="timer">Time Left: ${Math.floor(timeLeft/60)}:${String(timeLeft%60).padStart(2,'0')}</div>
        <div class="camera-container">
            <canvas id="canvas"></canvas>
            <div class="status" id="status">Initializing camera...</div>
        </div>
        <form id="test-form"></form>
      `;

      // Step 1: Setup camera
      showLoading('📷 Requesting camera access...');
      const cameraOk = await setupCamera();
      if (!cameraOk) {
        removeLoading();
        return;
      }

      // Step 2: Load AI model
      updateLoadingMsg('🤖 Loading AI monitoring model... (10-20 seconds)');
      await loadModel();
      removeLoading();

      // Step 3: Start monitoring
      monitoringStartTime = Date.now();
      monitoringStarted = true;
      document.getElementById('status').textContent = '✅ Monitoring active';
      monitor();

      // Step 4: Load questions
      const questions = JSON.parse(localStorage.getItem('questions')) || [];
      const testQuestions = questions.filter(q => q.testTitle === testType);

      if (testQuestions.length === 0) {
        alert("No questions available for this test.");
        return;
      }

      const form = document.getElementById('test-form');
      testQuestions.forEach((q, i) => {
        form.innerHTML += `
          <div class="test-card">
            <p>${i + 1}. ${q.questionText}</p>
            ${['option1','option2','option3','option4'].map(opt => `
                <label><input type="radio" name="q${i}" value="${opt}"> ${q[opt]}</label><br>
            `).join('')}
          </div>
        `;
      });

      form.innerHTML += `<button type="button" onclick="submitTest()">Submit Test</button>`;
      startTimer();
    }

    document.addEventListener("visibilitychange", () => {
      if (testInProgress && document.hidden && !malpracticeDetected && monitoringStarted) {
        malpracticeDetected = true;
        submitTest(true);
      }
    });

    async function setupCamera() {
      try {
        canvas = document.getElementById('canvas');
        context = canvas.getContext('2d');

        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });

        video = document.createElement('video');
        video.srcObject = stream;
        video.setAttribute('playsinline', ''); // iOS support
        video.muted = true;

        // Wait for metadata (dimensions) to load
        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;
          video.onerror = reject;
          setTimeout(() => reject(new Error('Camera metadata timeout')), 10000);
        });

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        // Play the video AFTER we know dimensions
        await video.play();

        // Confirm camera is working by drawing first frame
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        document.getElementById('status').textContent = '✅ Camera ready';
        return true;

      } catch (err) {
        console.error('Camera error:', err);
        const statusEl = document.getElementById('status');
        if (!statusEl) return false;
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          statusEl.innerHTML = `<div class="camera-error">❌ Camera permission denied.<br>Please click the camera icon in your browser's address bar and allow access, then try again.</div>`;
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          statusEl.innerHTML = `<div class="camera-error">❌ No camera found. Please connect a webcam and try again.</div>`;
        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
          statusEl.innerHTML = `<div class="camera-error">❌ Camera is being used by another app (e.g. Zoom, Teams). Please close it and try again.</div>`;
        } else {
          statusEl.innerHTML = `<div class="camera-error">❌ Camera error: ${err.message}<br><small>Make sure you're accessing this page via <strong>http://localhost:8081</strong></small></div>`;
        }
        return false;
      }
    }

    async function loadModel() {
      try {
        model = await cocoSsd.load();
      } catch (err) {
        console.error('Model load error:', err);
        const s = document.getElementById('status');
        if (s) s.textContent = '⚠️ AI model unavailable. Monitoring disabled.';
        model = null;
      }
    }

    function monitor() {
      if (!testInProgress || malpracticeDetected) return;

      // If no model, just keep drawing the video feed (camera still shows, no AI detection)
      if (!model) {
        if (video && canvas) context.drawImage(video, 0, 0, canvas.width, canvas.height);
        requestAnimationFrame(monitor);
        return;
      }

      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      model.detect(video).then(predictions => {
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        let persons = 0, forbiddenItems = [];

        predictions.forEach(pred => {
          const [x, y, width, height] = pred.bbox;
          context.beginPath();
          context.rect(x, y, width, height);
          context.strokeStyle = '#00ff00';
          context.lineWidth = 2;
          context.stroke();
          context.fillStyle = '#00ff00';
          context.font = '14px Arial';
          context.fillText(`${pred.class} ${Math.round(pred.score * 100)}%`, x, y > 14 ? y - 5 : 14);

          if (pred.class === 'person') persons++;
          if (['book', 'cell phone', 'mobile phone', 'paper'].includes(pred.class.toLowerCase())) {
            forbiddenItems.push(pred.class);
          }
        });

        const statusEl = document.getElementById('status');
        if (!statusEl) return;

        const elapsed = Date.now() - monitoringStartTime;
        const inGrace = elapsed < GRACE_PERIOD_MS;

        if (!inGrace && (persons !== 1 || forbiddenItems.length > 0)) {
          let reasons = [];
          if (persons === 0) reasons.push('No person detected');
          else if (persons > 1) reasons.push(`${persons} persons detected`);
          if (forbiddenItems.length > 0) reasons.push(`Forbidden: ${forbiddenItems.join(', ')}`);

          statusEl.innerHTML = `<span class="malpractice">⚠️ Malpractice: ${reasons.join(' | ')}</span>`;
          malpracticeDetected = true;
          clearInterval(timer);
          submitTest(true);
        } else {
          if (inGrace) {
            statusEl.textContent = `🔄 Calibrating... ${Math.ceil((GRACE_PERIOD_MS - elapsed) / 1000)}s`;
          } else {
            statusEl.textContent = `✅ ${persons} person detected — No violations`;
          }
          requestAnimationFrame(monitor);
        }
      }).catch(() => {
        if (video && canvas) context.drawImage(video, 0, 0, canvas.width, canvas.height);
        requestAnimationFrame(monitor);
      });
    }

    function startTimer() {
      timer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const el = document.getElementById("timer");
        if (el) el.textContent = `Time Left: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        timeLeft--;
        if (timeLeft < 0) {
          clearInterval(timer);
          submitTest();
        }
      }, 1000);
    }

    function submitTest(isMalpractice = false) {
      clearInterval(timer);
      testInProgress = false;

      // Stop camera
      if (video && video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }

      const form = document.getElementById('test-form');
      const questions = JSON.parse(localStorage.getItem('questions')) || [];
      const testQuestions = questions.filter(q => q.testTitle === testType);
      let mark = 0;

      if (!isMalpractice && form) {
        testQuestions.forEach((q, i) => {
          const selected = form.querySelector(`input[name="q${i}"]:checked`);
          if (selected && selected.value === q.correctAnswer) mark++;
        });
      }

      const username = localStorage.getItem("studentUsername") || "unknown_student";
      const scores = JSON.parse(localStorage.getItem("studentScores")) || [];
      const scoreObj = { username, score: mark, testType };
      const existingIndex = scores.findIndex(s => s.username === username && s.testType === testType);

      if (existingIndex >= 0) {
        scores[existingIndex] = scoreObj;
      } else {
        scores.push(scoreObj);
      }
      localStorage.setItem("studentScores", JSON.stringify(scores));

      document.getElementById('dashboard').innerHTML = `
        <h3>Test Completed!</h3>
        <p style="text-align:center;font-size:1.3rem;">
          Your score: <strong>${mark}</strong> out of <strong>${testQuestions.length}</strong>
        </p>
        ${isMalpractice ? '<p class="malpractice" style="text-align:center;">⚠️ Malpractice was detected during the test.</p>' : ''}
        <div style="text-align:center;margin-top:20px;">
          <button onclick="window.location.reload()">Return to Dashboard</button>
        </div>
      `;
    }
</script>

</body>
</html>
