<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SIET Teacher Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        .score-section {
          margin-top: 30px;
        }
        .student-score {
          background: #ffffff;
          border: 2px solid #a5d6a7;
          padding: 15px;
          margin-bottom: 15px;
          border-radius: 12px;
          box-shadow: 0px 0px 8px #c8e6c9;
        }
        .student-name {
          font-weight: bold;
          color: #1b5e20;
          font-size: 18px;
        }
        .attempt-details {
          margin-left: 10px;
          margin-top: 10px;
        }
        .attempt {
          margin-bottom: 8px;
          padding: 8px;
          border: 1px dashed #81c784;
          border-radius: 8px;
          background-color: #f1f8e9;
        }
        .label {
          font-weight: bold;
          color: #388e3c;
        }
        body {
          font-family: 'Poppins', sans-serif;
          margin: 0;
          padding: 0;
          background: linear-gradient(to right, #2ecc71, #27ae60);
          min-height: 100vh;
        }
        .main-content {
          background: #fff;
          padding: 30px;
          margin: 30px auto;
          border-radius: 15px;
          max-width: 1000px;
          box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        h3, h4 {
          text-align: center;
          color: #2c3e50;
          margin-top: 20px;
        }
        .question-form {
          width: 100%;
          display: block;
        }
        .question-form input,
        .question-form textarea,
        .question-form select,
        .question-form button {
          width: 100%;
          margin: 12px 0;
          padding: 14px 16px;
          border-radius: 10px;
          font-size: 1rem;
          border: 1px solid #d1d5db;
          box-sizing: border-box;
          background-color: #fff;
          transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .question-form input:focus,
        .question-form textarea:focus,
        .question-form select:focus {
          outline: none;
          border-color: #27ae60;
          box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.12);
        }
        .question-form textarea {
          min-height: 110px;
          resize: vertical;
        }
        .question-form button {
          background-color: #27ae60;
          color: white;
          border: none;
          cursor: pointer;
          font-weight: 600;
          margin-top: 18px;
        }
        .question-form button:hover {
          background-color: #229954;
        }
        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 30px;
        }
        th, td {
          padding: 14px;
          border: 1px solid #ddd;
          text-align: center;
        }
        th {
          background: #27ae60;
          color: white;
        }
        td {
          background: #f0fff4;
        }
        button {
          font-family: inherit;
        }
        .delete-btn {
          background-color: #e74c3c;
          color: #fff;
          border: 1px solid #d63a2f;
          border-radius: 5px;
          padding: 8px 14px;
          font-weight: 700;
          cursor: pointer;
        }
        .delete-btn:hover {
          background-color: #c0392b;
        }
        .mark-btn {
          background: #eaeaea;
          color: #222;
          border: 1px solid #c7c7c7;
          border-radius: 4px;
          padding: 6px 12px;
          font-weight: 600;
          cursor: pointer;
          margin: 0 4px;
        }
        .mark-btn:hover {
          background: #d9d9d9;
        }
        .download-btn-wrap {
          display: flex;
          justify-content: center;
          margin: 20px 0 10px;
        }
        .download-btn {
          background: #ffffff;
          color: #2c3e50;
          border: 1px solid #3d5366;
          border-radius: 6px;
          padding: 10px 18px;
          font-size: 1.05rem;
          font-weight: 600;
          cursor: pointer;
          box-shadow: none;
        }
        .download-btn:hover {
          background: #f3f5f6;
        }
        .pass {
          color: green;
          font-weight: bold;
        }
        .fail {
          color: red;
          font-weight: bold;
        }
    </style>
</head>
<body>
<h3>📋 Teacher Dashboard</h3>
<div class="main-content">
    <h4>🎓 Create a New Question</h4>
    <form id="add-question-form" class="question-form">
        <input type="text" id="test-title" placeholder="Test Title (e.g., CTPS)" />
        <input type="number" id="test-duration" placeholder="Test Duration (minutes)" />
        <input type="number" id="total-questions" placeholder="Number of Questions in Set" />
        <textarea id="question" placeholder="Enter question"></textarea>
        <input type="text" id="option1" placeholder="Option 1" />
        <input type="text" id="option2" placeholder="Option 2" />
        <input type="text" id="option3" placeholder="Option 3" />
        <input type="text" id="option4" placeholder="Option 4" />
        <select id="correct-answer">
            <option value="" disabled selected>Select Correct Answer</option>
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
            <option value="option4">Option 4</option>
        </select>
        <button type="button" onclick="addQuestion()">Add Question</button>
    </form>

    <h4>📄 Existing Questions</h4>
    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Test</th>
            <th>Question</th>
            <th>Answer</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="question-body"></tbody>
    </table>

    <h4>📊 Student Scores</h4>
    <div class="download-btn-wrap">
        <button class="download-btn" onclick="downloadCSV()">Download CSV</button>
    </div>
    <table>
        <thead>
        <tr>
            <th>Username</th>
            <th>Test</th>
            <th>Score</th>
            <th>Status</th>
            <th>Mark</th>
            <th>Remove</th>
        </tr>
        </thead>
        <tbody id="score-body"></tbody>
    </table>

    <div class="score-section" id="scoreSection"></div>
</div>

<script>

    function formatTime(isoString) {
      const date = new Date(isoString);
      return date.toLocaleString();
    }

    function addQuestion() {
      const title = document.getElementById("test-title").value.trim();
      const duration = parseInt(document.getElementById("test-duration").value);
      const count = parseInt(document.getElementById("total-questions").value);
      const qText = document.getElementById("question").value.trim();
      const o1 = document.getElementById("option1").value.trim();
      const o2 = document.getElementById("option2").value.trim();
      const o3 = document.getElementById("option3").value.trim();
      const o4 = document.getElementById("option4").value.trim();
      const correct = document.getElementById("correct-answer").value;

      if (!title || !duration || !count || !qText || !o1 || !o2 || !o3 || !o4 || !correct) {
        alert("Please fill in all fields.");
        return;
      }

      const question = {
        testTitle: title,
        questionText: qText,
        option1: o1,
        option2: o2,
        option3: o3,
        option4: o4,
        correctAnswer: correct
      };

      const questions = JSON.parse(localStorage.getItem("questions")) || [];
      questions.push(question);
      localStorage.setItem("questions", JSON.stringify(questions));
      localStorage.setItem(`duration_${title}`, duration * 60);
      localStorage.setItem(`count_${title}`, count);

      alert("✅ Question added!");
      document.getElementById("add-question-form").reset();
      loadQuestions();
    }

    function loadQuestions() {
      const questions = JSON.parse(localStorage.getItem("questions")) || [];
      const table = document.getElementById("question-body");
      table.innerHTML = "";
      questions.forEach((q, i) => {
        table.innerHTML += `<tr>
          <td>${i + 1}</td>
          <td>${q.testTitle}</td>
          <td>${q.questionText}</td>
          <td>${q[q.correctAnswer]}</td>
          <td><button class='delete-btn' onclick='deleteQuestion(${i})'>Delete</button></td>
        </tr>`;
      });
    }

    function deleteQuestion(index) {
      const questions = JSON.parse(localStorage.getItem("questions")) || [];
      questions.splice(index, 1);
      localStorage.setItem("questions", JSON.stringify(questions));
      loadQuestions();
    }

    function loadScores() {
      const scores = JSON.parse(localStorage.getItem("studentScores")) || [];
      const table = document.getElementById("score-body");
      table.innerHTML = "";
      scores.forEach((entry, i) => {
        table.innerHTML += `<tr>
          <td>${entry.username}</td>
          <td>${entry.testType}</td>
          <td>${entry.score}</td>
          <td class="${entry.status}">${entry.status || '-'}</td>
          <td><button class='mark-btn' type='button' onclick='markStatus(${i}, "pass")'>Pass</button><button class='mark-btn' type='button' onclick='markStatus(${i}, "fail")'>Fail</button></td>
          <td><button class='delete-btn' type='button' onclick='removeScore(${i})'>Delete</button></td>
        </tr>`;
      });

      // Grouped attempt display
      const grouped = {};
      scores.forEach(score => {
        if (!grouped[score.username]) grouped[score.username] = [];
        grouped[score.username].push(score);
      });

      const section = document.getElementById("scoreSection");
      section.innerHTML = ""; // Clear previous content
      for (const username in grouped) {
        const attempts = grouped[username];
        const studentDiv = document.createElement("div");
        studentDiv.className = "student-score";

        studentDiv.innerHTML = `<div class="student-name">Student Roll Number: ${username}</div><div class="attempt-details"></div>`;

        const detailsDiv = studentDiv.querySelector(".attempt-details");
        attempts.forEach((attempt, index) => {
          const attemptDiv = document.createElement("div");
          attemptDiv.className = "attempt";
          attemptDiv.innerHTML = `
            <div><span class="label">Attempt #${index + 1}</span></div>
            <div><span class="label">Test Type:</span> ${attempt.testType}</div>
            <div><span class="label">Score:</span> ${attempt.score}</div>
            <div><span class="label">Status:</span> ${attempt.status || '-'}</div>
            <div><span class="label">Time:</span> ${formatTime(attempt.timestamp)}</div>
          `;
          detailsDiv.appendChild(attemptDiv);
        });

        section.appendChild(studentDiv);
      }
    }

    function markStatus(index, status) {
      const scores = JSON.parse(localStorage.getItem("studentScores")) || [];
      scores[index].status = status;
      localStorage.setItem("studentScores", JSON.stringify(scores));
      loadScores();
    }

    function removeScore(index) {
      const scores = JSON.parse(localStorage.getItem("studentScores")) || [];
      scores.splice(index, 1);
      localStorage.setItem("studentScores", JSON.stringify(scores));
      loadScores();
    }

    function downloadCSV() {
      const scores = JSON.parse(localStorage.getItem("studentScores")) || [];
      let csv = "Username,Test,Score,Status\n";
      scores.forEach(entry => {
        csv += `${entry.username},${entry.testType},${entry.score},${entry.status || '-'}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "student_scores.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    window.onload = () => {
      loadQuestions();
      loadScores();
    };
</script>
</body>
</html>
